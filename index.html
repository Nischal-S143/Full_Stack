<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    *{
      padding: 0px;
      margin: 0px;
    }
    @font-face {
      font-family: "Inflate PTX";
      src: url("baby-plums-font/BabyPlums-rv2gL.ttf") ;
    }
    h1{
      font-family: Inflate PTX;
    }
    #myid{
      background-color: red;
    }
    .cl{
      color: blue;
    }
    h2{
      color: red;
      font-weight: 900;
    }
    input[type=email]{
      border-radius: 10px;
      background-color: aqua;
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <h2>Selectors
  </h2>
  <ul>
    <li>Universal</li>
    <li id="myid">Id</li>
    <li class="cl">class</li>
    <li class="cl">class</li>
    <li>Elements</li>
    <li>Attribute</li>
    <li>Pseudo Class</li>
    <li>Pseudo Elements</li>
    <input type="email" placeholder="email">
    
  </ul>
</body>
</html>
