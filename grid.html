<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      display: grid;
      grid-template-columns: repeat(auto-fit , minmax(250px,1fr));
      outline: 1px solid black;
      grid-template-areas: 
      "box1 box1 box2"
      "box3 box4 box5"
      "box3 box6 box5"
      "box7 box6 box5";
    }
    .container>div{
      font-size: 40px;
      outline: 1px dashed  black;
    }
    .container2{
      display: grid;
      grid-template-columns: repeat(auto-fit , minmax(250px,1fr));
      outline: 1px solid black;
    }
    .container2>div{
      font-size: 40px;
      outline: 1px dashed black;
    }
  </style>
</head>
<body>
      <div class="container">
        <div style="grid-area: box1;">1</div>
        <div style="grid-area: box2;">2</div>
        <div style="grid-area: box3;">3</div>
        <div style="grid-area: box4;">4</div>
        <div style="grid-area: box5;">5</div>
        <div style="grid-area: box6;">6</div>
      </div>
      <br>
      <br>
      <div class="container2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
      </div>
</body>
</html>
