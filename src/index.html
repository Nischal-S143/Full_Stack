<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // var name = "Nischal";
        // console.log("Using var:", name);

        // let
        // let age = 20;
        // console.log("Using let:", age);

        // const
        // const college = "GLA University";
        // console.log("Using const:", college);

        // hoisting 
        // console.log(a);
        // var a = 5;

        // let and const will give the referernce error where as var will give undifined
        // this is called hoisting

        // 1. String
        let name = "Nischal";
        console.log(name);

        // 2. Number
        let age = 20;
        let marks = 85.5;
        console.log(age);
        console.log(marks);

        // 3. Boolean
        let isStudent = true;
        console.log(isStudent);

        // 4. Undefined
        let city;
        console.log(city);

        // 5. Null
        let phone = null;
        console.log(phone);

        // 6. BigInt
        let bigNumber = 12345678901234567890n;
        console.log(bigNumber);

        // 7. Symbol
        let id = Symbol("id");
        console.log(id);

        // 8. Object
        let student = {
            name: "Nischal",
            age: 20,
            course: "B.Tech"
        };
        console.log(student);

        // 9. Array
        let subjects = ["JavaScript", "Java", "Python"];
        console.log(subjects);

    </script>
</body>
</html>
